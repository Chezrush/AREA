[package]
name = "text-similarity-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "text-similarity-rust"
path = "src/main.rs"

[dependencies]
actix-web = "4"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
